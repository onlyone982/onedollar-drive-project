<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Dollar Drive – Win a Day in Your Dream Car</title>
<meta name="description" content="Get official One Dollar Drive merch, earn sweepstakes entries, and win a day behind the wheel of a Porsche 911 GT3 RS. No purchase necessary.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://onedollardrive.com/">
<meta name="theme-color" content="#ffcc00">

<meta property="og:type" content="website">
<meta property="og:site_name" content="One Dollar Drive">
<meta property="og:title" content="One Dollar Drive – Win a Day in Your Dream Car">
<meta property="og:description" content="Merch from $1. Every item includes sweepstakes entries for a day in a Porsche 911 GT3 RS. No purchase necessary.">
<meta property="og:url" content="https://onedollardrive.com/">
<meta property="og:image" content="https://onedollardrive.com/og-image.jpg">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="ko_KR">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="One Dollar Drive – Win a Day in Your Dream Car">
<meta name="twitter:description" content="Merch from $1. Win a day behind the wheel of a Porsche 911 GT3 RS. No purchase necessary.">
<meta name="twitter:image" content="https://onedollardrive.com/og-image.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-LWQCX5XZ9D"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-LWQCX5XZ9D');
</script>
</head>
<body>

<header class="site-header">
  <a class="brand" href="./">ONE<span class="accent">$</span>DRIVE</a>
  <nav class="main-nav">
    <a href="#how" data-i18n="nav.how"></a>
    <a href="#shop" data-i18n="nav.shop"></a>
    <a href="./free-entry.html" data-i18n="nav.free"></a>
    <a href="./official-rules.html" data-i18n="nav.rules"></a>
    <a href="#faq" data-i18n="nav.faq"></a>
  </nav>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="langBtn" data-i18n="lang.toggle"></button>
    <button class="btn btn-sm" id="loginBtn" data-i18n="auth.login" hidden></button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" data-i18n="auth.logout" hidden></button>
  </div>
</header>

<main>
  <!-- ===== Hero ===== -->
  <section class="hero container">
    <div class="hero-copy">
      <div class="eyebrow" id="heroEyebrow" data-i18n="hero.eyebrow" data-var-n="1"></div>
      <h1 data-i18n="hero.title" data-i18n-html></h1>
      <p class="lead" data-i18n="hero.sub"></p>
      <div class="cta-row">
        <a class="btn btn-lg" href="#shop" data-i18n="hero.ctaShop"></a>
        <a class="btn btn-ghost btn-lg" href="./free-entry.html" data-i18n="hero.ctaFree"></a>
      </div>
      <p class="fine" data-i18n="hero.npn"></p>
    </div>

    <div class="hero-media">
      <div class="video-frame">
        <iframe id="heroVideo" title="Porsche 911 GT3 RS" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <button class="link-btn" id="copyLinkBtn">🔗 <span data-i18n="common.share"></span></button>
    </div>
  </section>

  <!-- ===== Round card ===== -->
  <section class="container">
    <div class="round-card">
      <div class="round-main">
        <span class="status-pill" id="roundStatus"></span>
        <div class="label" data-i18n="round.prize"></div>
        <h2 id="prizeTitle"></h2>
        <div class="car-name" id="carName"></div>
        <ul class="specs">
          <li><b>518</b> hp</li>
          <li><b>3.2</b> s 0–62 mph</li>
          <li><b>184</b> mph top</li>
        </ul>
      </div>
      <div class="round-facts">
        <div class="fact">
          <div class="label" data-i18n="round.arv"></div>
          <div class="fact-value" id="prizeArv"></div>
        </div>
        <div class="fact">
          <div class="label" data-i18n="round.ends"></div>
          <div class="fact-value mono" id="countdown"></div>
        </div>
        <div class="fact">
          <div class="label" data-i18n="round.draw"></div>
          <div class="fact-value" id="drawDate"></div>
        </div>
      </div>
      <div class="milestone">
        <div class="milestone-head">
          <span class="label" data-i18n="round.milestone"></span>
          <span class="mono" id="milestoneText"></span>
        </div>
        <div class="bar"><div class="bar-fill" id="milestoneBar"></div></div>
        <div class="muted small" id="supporterLine"></div>
        <div class="muted tiny" data-i18n="round.milestoneNote"></div>
      </div>
    </div>
  </section>

  <!-- ===== How it works ===== -->
  <section class="container section" id="how">
    <h2 class="section-title" data-i18n="how.title"></h2>
    <ol class="steps">
      <li><span class="step-n">01</span><h3 data-i18n="how.1.title"></h3><p data-i18n="how.1.body"></p></li>
      <li><span class="step-n">02</span><h3 data-i18n="how.2.title"></h3><p data-i18n="how.2.body"></p></li>
      <li><span class="step-n">03</span><h3 data-i18n="how.3.title"></h3><p data-i18n="how.3.body"></p></li>
    </ol>
  </section>

  <!-- ===== Shop ===== -->
  <section class="container section" id="shop">
    <h2 class="section-title" data-i18n="shop.title"></h2>
    <p class="muted" data-i18n="shop.sub"></p>
    <div class="product-grid" id="productGrid"></div>
    <p class="muted small" data-i18n="shop.note"></p>

    <div class="free-banner">
      <div>
        <h3 data-i18n="free.title"></h3>
        <p id="freeBody" data-i18n="free.body"></p>
      </div>
      <a class="btn btn-ghost" href="./free-entry.html" data-i18n="free.cta"></a>
    </div>
  </section>

  <!-- ===== Community ===== -->
  <section class="container section community">
    <div class="panel">
      <div class="panel-head"><span data-i18n="wall.title"></span></div>
      <ul class="wall" id="supporterWall"></ul>
    </div>

    <div class="panel chat">
      <div class="panel-head">
        <span data-i18n="chat.title"></span>
        <span class="online" id="onlineBadge" hidden><span class="dot"></span><span id="onlineCount">0</span> <span data-i18n="chat.online"></span></span>
      </div>
      <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
      <form class="chat-input" id="chatForm">
        <input type="text" id="chatInput" maxlength="300" autocomplete="off" disabled>
        <button class="btn btn-sm" id="chatSend" type="submit" data-i18n="chat.send" disabled></button>
      </form>
    </div>
  </section>

  <!-- ===== Story ===== -->
  <section class="container section story">
    <h2 class="section-title" data-i18n="story.title"></h2>
    <p data-i18n="story.body" data-i18n-html></p>
    <p class="muted" data-i18n="story.sign"></p>
  </section>

  <!-- ===== FAQ ===== -->
  <section class="container section" id="faq">
    <h2 class="section-title" data-i18n="faq.title"></h2>
    <div class="faq">
      <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
      <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
      <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
      <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
      <details><summary data-i18n="faq.q5"></summary><p id="faqA5" data-i18n="faq.a5"></p></details>
    </div>
  </section>
</main>

<footer class="site-footer container" id="siteFooter"></footer>

<script type="module" src="./js/common.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
