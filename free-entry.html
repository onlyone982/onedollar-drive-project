<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Entry – One Dollar Drive</title>
<meta name="description" content="Enter the One Dollar Drive sweepstakes for free. No purchase necessary.">
<link rel="canonical" href="https://onedollardrive.com/free-entry.html">
<meta name="theme-color" content="#ffcc00">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="./">ONE<span class="accent">$</span>DRIVE</a>
  <nav class="main-nav">
    <a href="./#shop" data-i18n="nav.shop"></a>
    <a href="./community.html" data-i18n="nav.community"></a>
    <a href="./official-rules.html" data-i18n="nav.rules"></a>
  </nav>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="langBtn" data-i18n="lang.toggle"></button>
    <div id="accountArea"></div>
  </div>
</header>

<main class="container legal">
  <h1>Free Entry</h1>
  <p class="muted">No purchase necessary. You can submit <b id="perDay">1</b> free entry per day while the round is open. Free entries have the same chance of winning as paid entries. See the <a href="./official-rules.html">Official Rules</a>.</p>

  <div class="form-card">
    <div id="msg"></div>

    <div id="needLogin" hidden>
      <p>Sign in so we can contact you if you win and make sure each person enters once per day.</p>
      <button class="btn" id="loginInline">Sign in</button>
    </div>

    <form id="entryForm" hidden novalidate>
      <div class="field">
        <label for="fullName">Full legal name</label>
        <input id="fullName" required maxlength="80" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required maxlength="120" readonly>
      </div>
      <div class="field">
        <label for="state">State of residence</label>
        <select id="state" required></select>
      </div>
      <label class="check"><input type="checkbox" id="adult" required> <span>I am at least 18 years old (or the age of majority where I live, if older).</span></label>
      <label class="check"><input type="checkbox" id="agree" required> <span>I have read and agree to the <a href="./official-rules.html" target="_blank">Official Rules</a>.</span></label>
      <button class="btn btn-lg btn-block" id="submitBtn" type="submit">Submit today's free entry</button>
    </form>

    <div id="myEntries" class="muted small" style="margin-top:1rem"></div>
  </div>
</main>

<footer class="site-footer container" id="siteFooter"></footer>

<script type="module" src="./js/account.js"></script>
<script type="module" src="./js/free-entry.js"></script>
</body>
</html>
